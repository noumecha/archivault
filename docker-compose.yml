# docker-compose.yml
services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: archivault_web
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: archivault_db
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
