#version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: archivault_web
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: archivault_db
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'

volumes:
  mysql_data:
