#version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: archivault_web
    restart: always
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: archivault_db
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3307:3306'

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: archivault_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - '8080:80'

volumes:
  mysql_data:
