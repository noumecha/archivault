# docker-compose.yml
services:
  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: archivault_web
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: archivault_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-archivault_db}
      MYSQL_USER: ${MYSQL_USER:-archivault_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-archivault_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - archivault_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10
    env_file:
      - .env

volumes:
  mysql_data:

networks:
  archivault_network:
    driver: bridge
