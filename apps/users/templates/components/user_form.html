{# apps/users/templates/components/user_form.html #}
{# Template réutilisable pour le formulaire #}
<div class="row">
  <div class="col-md-6 form-group mb-3">
    <label for="username" class="form-label">Nom d'utilisateur</label>
    <input type="text" class="form-control" id="username" name="username" required>
  </div>

  <div class="col-md-6 form-group mb-3">
    <label for="first_name" class="form-label">Prénom</label>
    <input type="text" class="form-control" id="first_name" name="first_name">
  </div>
</div>


<div class="row">
  <div class="col-md-12 form-group mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email">
  </div>

  <!-- password -->
  <div class="col-md-6 form-group mb-3">
    <label for="password1" class="form-label">Mot de passe</label>
    <input type="password" class="form-control" id="password1" name="password1" required>
  </div>

  <div class="col-md-6 form-group mb-3">
    <label for="password2" class="form-label">Confirmer le mot de passe</label>
    <input type="password" class="form-control" id="password2" name="password2" required>
  </div>
</div>

<div class="row">
  <!-- cellule -->
  <div class="col-md-12 form-group mb-3">
    <label for="cellule" class="form-label">Cellule</label>
    <select class="form-select" id="cellule" name="cellule">
      <option value="">-- Sélectionner une cellule --</option>
      {% for cellule in cellules %}
        <option value="{{ cellule.id }}">{{ cellule }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- roles -->
  <div class="col-md-12 form-group mb-3">
    <label for="role" class="form-label">Rôle</label>
    <select class="form-select" id="role" name="role" required>
      <option value="">-- Sélectionner un rôle --</option>
      {% for role in roles %}
        <option value="{{ role.value }}">{{ role.label }}</option>
      {% endfor %}
    </select>
  </div>
</div>

<div class="row">
  <!-- statut -->
  <div class="col-md-12 form-group mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="is_active" name="is_active">
      <label class="form-check-label" for="is_active">Actif</label>
    </div>
  </div>
</div>
