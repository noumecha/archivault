<table class="table table-sm">
    <tr>
        <th>Titre</th>
        <th>Date Creation</th>
        <th>Action</th>
    </tr>
    {% for typedocument in typedocuments %}
        <tr data-id="{{ typedocument.id }}">
            <td>{{ typedocument.titre }} </td>
            <td>{{ typedocument.Date_creation }}</td>
            <td>
                <div class="dropdown">
                    <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                        <i class="bx bx-dots-vertical-rounded"></i>
                    </button>
                    <div class="dropdown-menu">
                        <a 
                            class="dropdown-item primary" 
                            href="#"
                            data-bs-target="#create-typedocument-modal"
                            data-bs-toggle="modal"
                            data-action = "update"
                            data-id="{{ typedocument.id }}"
                        >
                            <i class="bx bx-edit-alt me-1"></i>Modifier
                        </a>
                        <a href="#" 
                            class="dropdown-item btn-success delete-typedocument"
                            data-bs-target="#delete-typedocument-modal-{{ typedocument.id }}"
                            data-bs-toggle="modal"
                        >
                            <i class="bx bx-trash me-1"></i>Supprimer
                        </a>
                    </div>
                    <!-- delete typedocument -->
                    <div class="modal fade" id="delete-typedocument-modal-{{ typedocument.id }}" tabindex="-1" aria-labelledby="exampleModalLabel">
                        <div class="modal-dialog">
                            <div class="modal-content p-0">
                                <form action="{% url 'baux:typedocument_delete' typedocument.id %}" method="post" id="delete-typedocument-form">
                                    {% csrf_token %}
                                    <div class="modal-header">
                                        <h5 class="modal-title">Suppression d'un type de document</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div id="modal-content-message">
                                            Voulez vous vraiment supprimer : {{ typedocument }} ?
                                        </div>
                                        <input type="hidden" value="{{ typedocument.id }}" name="id" id="delete-typedocument-input-id">
                                    </div>
                                    <div class="modal-footer flex-row-reverse">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                                        <button type="submit" class="btn btn-primary">Supprimer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="3" class="text-center">Aucun type trouvé.</td>
        </tr>
    {% endfor %}
</table>
