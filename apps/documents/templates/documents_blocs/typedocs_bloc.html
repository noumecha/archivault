<div class="card p-3">
    <div class="card-header">
        <div class="row d-flex justify-content-between align-items-center">
            <div class="col-md-8 col-lg-8">
                <h3 class="">Listes des types de documents</h3>
                <p class="text-sm">
                    Gérer les types de documents
                </p>
            </div>
            <div class="col-md-4 col-lg-4 text-end">
                <button
                  type="button"
                  class="btn"
                  id="refresh-button"
                >
                  <i class="menu-icon ri-restart-line"></i> Rafraîchir
                </button>
                <button
                    type="button"
                    class="btn btn-lg btn-dark btn-primary text-white"
                    data-bs-toggle="modal"
                    data-action = "create"
                    id="add-button"
                    data-bs-target="#create-typedocument-modal"
                >
                    <i class="menu-icon ri-add-line"></i> Ajouter
                </button>
            </div>
        </div>
        <form action="" class="row mt-3" id="typedocument-search-form">
            <div class="col-md-12 col-lg-12">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Rechercher un typedocument" name="search" id="search">
                    <button class="btn btn-outline-primary" type="button" id="clearSearch">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </div>
            {% for filter in filters %}
              <div class="col-md-6 col-lg-6 d-flex mt-2 gap-2">
                <select name="{{ filter.name }}" class="form-select" id="id_{{ filter.name }}">
                  <option value="">-- {{ filter.name|capfirst }} --</option>
                  {% for item in filter.items %}
                    {% if item.value %}
                      <option value="{{ item.value }}">{{ item.label }}</option>
                    {% else %}
                      <option value="{{ item.id }}">{{ item }}</option>
                    {% endif %}
                  {% endfor %}
                </select>
              </div>
            {% endfor %}
        </form>
    </div>
    <div class="container-flex" id="typedocument-table-container">
    </div>
</div>
<!-- create or update typedocument -->
<div class="modal fade" id="create-typedocument-modal" tabindex="-1" aria-labelledby="exampleModalLabel">
    <div class="modal-dialog modal-lg">
        <div class="modal-content p-0">
            <form id="typedocumentForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Enregistrement des informations sur un Type de document </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="typedocument-form-content">Chargement...</div>
                    <div class="alert alert-success" style="display: none;" id="form-success"></div>
                    <div class="alert alert-danger" style="display: none;" id="form-error"></div>
                    <input type="hidden" value="" name="id" id="update-id">
                </div>
                <div class="modal-footer flex-row-reverse">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    <button type="submit" id="save-btn" class="btn">...</button>
                </div>
            </form>
        </div>
    </div>
</div>
