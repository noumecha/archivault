<div class="row">
  <!-- Titre -->
  <div class="col-md-12 form-group mb-4 d-none" id="container-titre">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <input type="text" id="titre" class="form-control" name="titre" placeholder="Titre du document" />
        <label for="titre">Titre</label>
      </div>
    </div>
  </div>

  <div class="col-md-12 mb-4" id="container-dropzone">
    <div id="drop-area" class="border rounded p-4 text-center bg-light" style="min-height:140px; cursor: pointer; border-style: dashed !important; border-color: #d4d4d4 !important;">
      <i class="ri-upload-cloud-2-line ri-2x text-primary"></i>
      <p class="mb-0 mt-2">Glisser-déposer des fichiers ici ou <span class="text-primary fw-bold">Parcourir</span></p>
      <input id="file-input" name="fichiers" type="file" multiple style="display:none;">
    </div>
    <div id="previews" class="row mt-3 g-2"></div>

    <div class="mt-3" id="progress-container" style="display:none;">
      <div class="progress" style="height: 8px;">
        <div id="upload-progress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
      </div>
      <small id="progress-text" class="text-muted">0%</small>
    </div>
  </div>

  <!-- Fichier -->
  <div class="col-md-12 form-group mb-4 d-none" id="container-fichier-unique">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <input type="file" id="fichier" class="form-control" name="fichier" />
        <label for="fichier text-primary">Remplacer le fichier (Optionnel)</label>
      </div>
    </div>
    <div id="current-file-info" class="mt-2 small text-primary fw-bold"></div>
  </div>

  <!-- Type & Sous-Type -->
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="type_document" name="type_document" required>
          <option value="">-- Sélectionner --</option>
          {% for t in types_documents %}
            <option value="{{ t.id }}">{{ t.libelle }}</option>
          {% endfor %}
        </select>
        <label for="type_document">Type de document</label>
      </div>
    </div>
  </div>
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="sous_type" name="sous_type">
          <option value="">-- Sélectionner --</option>
          {% for st in sous_types %}
            <option value="{{ st.id }}">{{ st.libelle }}</option>
          {% endfor %}
        </select>
        <label for="sous_type">Sous-type</label>
      </div>
    </div>
  </div>

  <!-- Thème & Cellule -->
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="theme" name="theme">
          <option value="">-- Sélectionner --</option>
          {% for th in themes %}
            <option value="{{ th.id }}">{{ th.libelle }}</option>
          {% endfor %}
        </select>
        <label for="theme">Thème</label>
      </div>
    </div>
  </div>
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="cellule" name="cellule">
          <option value="">-- Sélectionner --</option>
          {% for c in cellules %}
            <option value="{{ c.id }}">{{ c.nom }}</option>
          {% endfor %}
        </select>
        <label for="cellule">Unité de traitement </label>
      </div>
    </div>
  </div>

  <!-- Niveau d'accès & Profil -->
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="niveau_acces" name="niveau_acces" required>
          <option value="">-- Sélectionner --</option>
          {% for key, value in niveau_access %}
            <option value="{{ key }}">{{ value }}</option>
          {% endfor %}
        </select>
        <label for="niveau_acces">Niveau d'accès</label>
      </div>
    </div>
  </div>

  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="profil_document" name="profil_document" required>
          <option value="">-- Sélectionner --</option>
          {% for key, value in profil_documents %}
            <option value="{{ key }}">{{ value }}</option>
          {% endfor %}
        </select>
        <label for="profil_document">Profil document</label>
      </div>
    </div>
  </div>

  <!-- État & Créé par -->
  <div class="col-md-6 form-group mb-4">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="etat" name="etat" required>
          <option value="">-- Sélectionner --</option>
          {% for key, value in etats %}
            <option value="{{ key }}">{{ value }}</option>
          {% endfor %}
        </select>
        <label for="etat">État</label>
      </div>
    </div>
  </div>
</div>
