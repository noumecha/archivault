{# apps/documents/templates/components/forms/soustypedocument_form.html #}
<div class="row">
  <div class="col-md-12 form-group mb-5">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <input type="text" id="libelle" class="form-control" name="libelle" placeholder="Libellé du sous-type" />
        <label for="libelle">Libellé</label>
      </div>
    </div>
  </div>

  <div class="col-md-12 form-group mb-5">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <textarea id="description_soustypedocument" class="form-control" name="description_soustypedocument" placeholder="Description" style="height: 60px;"></textarea>
        <label for="description_soustypedocument">Description</label>
      </div>
    </div>
  </div>

  <div class="col-md-12 form-group mb-5">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="type_document" name="type_document">
          <option value="">-- Sélectionner un type --</option>
          {% for td in types_documents %}
            <option value="{{ td.id }}">{{ td.libelle }}</option>
          {% endfor %}
        </select>
        <label for="type_document">Type de Document</label>
      </div>
    </div>
  </div>
</div>
