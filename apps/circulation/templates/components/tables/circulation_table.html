{# apps/circulation/templates/components/circulation_table.html #}
<div id="table-loader" class="d-none text-center my-4">
  <i class="ri-loader-2-fill ri-2x spin text-primary"></i>
  <p class="mt-2">Chargement des données...</p>
</div>

<div class="table-responsive text-nowrap">
  <table class="table table-hover" id="data-table">
    <thead>
      <tr>
        <th style="width: 40px;">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="check-all-circulations">
          </div>
        </th>
        <th>Document</th>
        <th>Titre du circuit</th>
        <th>Initié par</th>
        <th>Date Début</th>
        <th>Progression</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="circulations-tbody">
      {# Injecté par JS #}
    </tbody>
  </table>
</div>

<div class="ms-3 me-3 d-flex justify-content-between align-items-center mt-4">
    <div id="pagination-info" class="text-muted small">
    </div>
    <nav aria-label="Page navigation">
        <ul class="pagination mb-0" id="circulations-pagination"></ul>
    </nav>
</div>
