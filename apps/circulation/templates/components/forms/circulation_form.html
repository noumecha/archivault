{# apps/circulation/templates/components/circulation_form.html #}
{# Template réutilisable du formulaire formulaire de circulation #}
<div class="row">
  <div class="col-md-6 mb-2">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <select class="form-select" id="doc-select" name="document" required>
          <option value="">Choisir un document...</option>
          {% for doc in documents %}
          <option value="{{ doc.id }}">{{ doc.titre }}</option>
          {% endfor %}
        </select>
        <label for="doc-select">Document concerné</label>
      </div>
    </div>
  </div>
  <div class="col-md-6 mb-2">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <input type="date" name="date-fin" id="date-fin" class="form-control">
        <label for="date-fin">Date d'échance</label>
      </div>
    </div>
  </div>
  <div class="col-md-12 mb-2">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <input type="text" class="form-control" id="circuit-titre" name="titre" placeholder="Ex: Approbation Facture Janvier" required>
        <label for="circuit-titre">Titre du circuit</label>
      </div>
    </div>
  </div>
  <div class="col-md-12 mb-2">
    <div class="input-group input-group-merge">
      <div class="form-floating form-floating-outline">
        <textarea class="form-control" id="circuit-desc" name="circuit-desc" placeholder="Description du circuit (optionnel)" style="height: 100px"></textarea>
        <label for="circuit-desc">Description du circuit</label>
      </div>
    </div>
  </div>
</div>
<h6 class="mt-3 border-bottom pb-2">Configuration des étapes (Workflow)</h6>
<div id="etapes-container">
    {# Les lignes d'étapes seront injectées ici par le bouton "Ajouter une étape" #}
</div>
<button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="btn-add-etape">
    <i class="ri-add-line"></i> Ajouter une étape
</button>
