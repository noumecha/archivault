{% extends layout_path %}
{% load static %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
      <span class="text-muted fw-light">Tâche /</span> Créer une tâche pour {{ document.titre }}
    </h4>
    <a href="{% url 'document_detail' document.pk %}" class="btn btn-outline-secondary">
      <i class="bx bx-arrow-back me-1"></i> Retour
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Nouvelle tâche</h5>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            <div class="alert alert-info">
              <i class="bx bx-info-circle me-2"></i>
              <strong>Document :</strong> {{ document.titre }}
            </div>

            <div class="mb-3">
              <label class="form-label">Titre <span class="text-danger">*</span></label>
              <input type="text" name="titre" class="form-control" required placeholder="Ex: Valider le contenu...">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="4" placeholder="Objectif, instructions détaillées..."></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Assignée à <span class="text-danger">*</span></label>
                <select name="assignee_a" class="form-select select2" required>
                  <option value="">-- Sélectionner --</option>
                  {% for user in utilisateurs %}
                  <option value="{{ user.pk }}">{{ user.get_full_name|default:user.username }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Priorité</label>
                <select name="priorite" class="form-select">
                  <option value="normale">Normale</option>
                  <option value="haute">Haute</option>
                  <option value="urgente">Urgente</option>
                  <option value="basse">Basse</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Statut</label>
                <select name="statut" class="form-select">
                  <option value="a_faire">À faire</option>
                  <option value="en_cours">En cours</option>
                  <option value="en_revision">En révision</option>
                  <option value="terminee">Terminée</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Échéance</label>
                <input type="date" name="date_echeance" class="form-control">
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="{% url 'document_detail' document.pk %}" class="btn btn-outline-secondary">Annuler</a>
              <button type="submit" class="btn btn-primary">
                <i class="bx bx-send me-1"></i> Créer la tâche
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
{% endblock %}
