{% extends layout_path %}

{% load static %}
{% load i18n %}

{% block title %}Circulations des documents{% endblock %}

{% load crispy_forms_tags %}
{% block content %}
<h2>Créer une circulation pour : {{ document.titre }}</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>Titre de la circulation</label>
        <input type="text" name="titre" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Description</label>
        <textarea name="description" class="form-control"></textarea>
    </div>
    <div class="mb-3">
        <label>Destinataires (dans l'ordre)</label>
        <select name="destinataires[]" class="form-select" multiple required>
            {% for user in utilisateurs %}
            <option value="{{ user.pk }}">{{ user.username }} ({{ user.role }})</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Créer la circulation</button>
</form>
{% endblock %}
{% block extra_js %}
{% endblock %}
