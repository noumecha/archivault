{% extends layout_path %}
{% load static %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
      <span class="text-muted fw-light">Circulation /</span> Nouveau circuit
    </h4>
    <a href="{% url 'circulation_list' %}" class="btn btn-outline-secondary">
      <i class="bx bx-arrow-back me-1"></i> Retour
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Créer une circulation pour : <strong>{{ document.titre }}</strong></h5>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Titre <span class="text-danger">*</span></label>
              <input type="text" name="titre" class="form-control" required placeholder="Ex: Validation direction...">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="3" placeholder="Contexte, instructions..."></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Destinataires <span class="text-danger">*</span>
                <small class="text-muted">(sélectionner dans l'ordre de traitement)</small>
              </label>
              <select name="destinataires[]" class="form-select select2" multiple required>
                {% for user in utilisateurs %}
                <option value="{{ user.pk }}">{{ user.get_full_name|default:user.username }} — {{ user.get_role_display }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="{% url 'circulation_list' %}" class="btn btn-outline-secondary">Annuler</a>
              <button type="submit" class="btn btn-primary">
                <i class="bx bx-send me-1"></i> Lancer la circulation
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
{% endblock %}
