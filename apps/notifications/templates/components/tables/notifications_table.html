<div id="table-loader" class="d-none text-center my-4">
  <i class="ri-loader-2-fill ri-2x spin text-white"></i>
  <p class="mt-2 text-white">Chargement des données...</p>
</div>

<div class="card">
  <div class="card-datatable table-responsive">
    <table class="table border-top">
      <thead>
        <tr>
          <th style="width: 40px;">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="check-all-notifications">
            </div>
          </th>
          {% for header in headers %}
            <th>{{ header }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody id="notifications-tbody">
      </tbody>
    </table>
  </div>
  <div class="ms-3 me-3 d-flex justify-content-between align-items-center mt-3 mb-3">
    <div id="pagination-info" class="text-muted small">
    </div>
    <nav aria-label="Page navigation">
        <ul class="pagination mb-0" id="notifications-pagination"></ul>
    </nav>
  </div>
</div>
